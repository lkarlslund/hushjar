[package]
name = "hushjar-core"
description = "Vault logic for Hushjar, independent of any user interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4"
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
rsa = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
uuid = { version = "1.29.3", features = ["v4"] }
