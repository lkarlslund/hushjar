[package]
name = "hushjar-core"
description = "Vault logic for Hushjar, independent of any user interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["security-key"]
security-key = ["dep:authenticator"]

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
# Security keys over USB, with pure-Rust cryptography. On Linux it links the
# system libudev; build without default features to leave it out.
authenticator = { version = "0.5.0", default-features = false, features = ["crypto_rust"], optional = true }
argon2 = "0.6.0"
base64 = "0.23.1"
csv = "1.3"
cbc = { version = "0.2.1", features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
pkcs8 = { version = "0.11.0", features = ["std", "pem", "encryption"] }
rmpv = "1.3.1"
rsa = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.2"
# Same pin and reasoning as in hushjar-agent. "encryption" reads passphrase-
# protected OpenSSH keys; "ed25519" and "rsa" also switch on random key
# generation (their feature lists include ssh-key's "rand_core" feature, see
# ssh-key-0.7.0-rc.12/Cargo.toml: ed25519 = ["dep:ed25519-dalek", "rand_core"]).
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ed25519", "rsa", "encryption"] }
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
# A software authenticator for the WebAuthn interop test.
p256 = { version = "0.14.0", features = ["ecdsa"] }
uuid = { version = "1.29.3", features = ["v4"] }
