[package]
name = "hushjar"
description = "A desktop app for your secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
getrandom = "0.4"
hushjar-agent = { version = "0.1.0", path = "../hushjar-agent" }
hushjar-core.workspace = true
png = { version = "0.18", optional = true }
serde_json = "1.0.154"
slint.workspace = true
zeroize = "1.9.2"

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[features]
# Saves PNGs of the window's main states; see src/snapshot.rs.
snapshot = ["dep:png"]
