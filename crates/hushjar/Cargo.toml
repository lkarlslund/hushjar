[package]
name = "hushjar"
description = "A desktop app for your secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The app is a library so that the desktop binary (src/main.rs) and the
# Android build share it. Android loads a shared library, so
# scripts/build-android.sh builds this target with `--crate-type cdylib`;
# desktop builds keep the default rlib and link it into the binary.
path = "src/lib.rs"

[[bin]]
name = "hushjar"
path = "src/main.rs"

# Ubuntu packages, built with cargo-deb by scripts/package-deb.sh. `$auto`
# finds the libraries the binary links; the rest are the ones it loads at run
# time (Wayland, X11, OpenGL/EGL, xkbcommon, D-Bus), which no tool can see.
[package.metadata.deb]
maintainer = "Lars Karlslund <lkarlslund@users.noreply.github.com>"
copyright = "2026 Lars Karlslund"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Hushjar is a desktop client for Bitwarden and self-hosted Vaultwarden \
accounts: it keeps an offline copy of the vault, fills the clipboard, \
generates passwords and serves the vault's SSH keys as an SSH agent."""
section = "utils"
priority = "optional"
depends = "$auto, libegl1, libgl1, libwayland-client0, libwayland-egl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrender1, libdbus-1-3"
assets = [
    ["target/release/hushjar", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.lkarlslund.Hushjar.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.lkarlslund.Hushjar.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/io.github.lkarlslund.Hushjar.policy", "usr/share/polkit-1/actions/", "644"],
    ["../../README.md", "usr/share/doc/hushjar/", "644"],
]

[dependencies]
getrandom = "0.4"
hushjar-agent = { version = "0.1.0", path = "../hushjar-agent" }
hushjar-core.workspace = true
png = { version = "0.18", optional = true }
serde_json = "1.0.154"
thiserror = "2"
zeroize = "1.9.2"

# Desktop integration over D-Bus (src/desktop). All of these are already in
# the build through Slint (zbus, ksni, resvg) and zbus (futures-lite,
# async-channel), so they add no new crates. zbus runs on async-io with its
# own executor thread; no tokio runtime.
# Desktop only: windowing through winit, the system clipboard and file
# dialogs. Android has none of these crates' backends.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rfd = "0.18"
slint = { workspace = true, features = ["unstable-winit-030"] }

# Android: Slint's NativeActivity backend instead of winit.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
futures-lite = "2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
resvg = { version = "0.49", default-features = false }
zbus = "5"

[dev-dependencies]
# Slint's headless backend, to check the window's layout rules in unit tests
# (src/layout_tests.rs). Internal to Slint, so pinned to its exact version.
i-slint-backend-testing = "=1.19.1"
# For the worker's tests against a Vaultwarden test server (including
# src/worker/items.rs).
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }

[build-dependencies]
embed-resource = "3"
slint-build.workspace = true

[lints]
workspace = true

[features]
# Saves PNGs of the window's main states; see src/snapshot.rs.
snapshot = ["dep:png"]
