name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The rolling release runs the whole of CI as its test gate.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95"

jobs:
  lint-and-test:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxi-dev libudev-dev openssh-client
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  interop:
    name: Linux (Vaultwarden interop)
    runs-on: ubuntu-24.04
    services:
      vaultwarden:
        # Keep in step with tests/interop/compose.yaml.
        image: vaultwarden/server:1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
        ports:
          - 18281:80
        env:
          DOMAIN: http://127.0.0.1:18281
          SIGNUPS_ALLOWED: "true"
          PUSH_ENABLED: "false"
          ICON_SERVICE: internal
          DISABLE_ICON_DOWNLOAD: "true"
          LOG_LEVEL: warn
          LOGIN_RATELIMIT_SECONDS: "1"
          LOGIN_RATELIMIT_MAX_BURST: "1000000"
          UNAUTHENTICATED_RATELIMIT_SECONDS: "1"
          UNAUTHENTICATED_RATELIMIT_MAX_BURST: "1000000"
          ADMIN_RATELIMIT_SECONDS: "1"
          ADMIN_RATELIMIT_MAX_BURST: "1000000"
        options: >-
          --tmpfs /data:rw,size=268435456,mode=0700
          --health-cmd "curl -fsS http://127.0.0.1:80/alive || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUSHJAR_INTEROP: http://127.0.0.1:18281
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxi-dev libudev-dev
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: interop
      - name: Interop tests (invented accounts on the throwaway server)
        run: cargo test -p hushjar-core --test interop --locked -- --test-threads=1

  linux-arm64:
    name: Linux arm64 (build, tests)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxi-dev libudev-dev openssh-client
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  windows:
    name: Windows ${{ matrix.arch }} (build, tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup if the runner has none
        shell: pwsh
        run: scripts/ci-install-rustup.ps1
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  macos:
    name: macOS ${{ matrix.arch }} (build, tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
