name: Rolling release

# Twice a day, if main has changed since the last release: runs the whole of
# CI, then builds the Linux tarball, the Windows zip and the macOS app (each
# for amd64 and arm64), Ubuntu packages for 24.04 and 26.04 (amd64 and arm64)
# and an Arch Linux package (x86_64), and publishes them with .sha256 files as
# release r<commit count> (scripts/build-number), with the commits since the
# last release as its changelog. A release that is missing files is rebuilt
# in place (scripts/release-assets lists them).
on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and replace assets even when the latest release is already at HEAD"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rolling-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95"

jobs:
  meta:
    name: Compute release metadata
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.meta.outputs.changed }}
      repair_release: ${{ steps.meta.outputs.repair_release }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
        run: |
          set -euo pipefail

          latest_tag="$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^r[0-9]+$"))] | sort_by(ltrimstr("r") | tonumber) | reverse | .[0] // ""')"
          if [[ -n "$latest_tag" ]]; then
            git fetch --force origin "refs/tags/${latest_tag}:refs/tags/${latest_tag}" || true
          fi

          release_has_expected_assets() {
            local tag="$1"
            local missing=0
            local asset
            mapfile -t release_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            while read -r asset; do
              if ! printf '%s\n' "${release_assets[@]}" | grep -Fxq "$asset"; then
                echo "Release ${tag} is missing ${asset}."
                missing=1
              fi
            done < <(scripts/release-assets "$tag")
            return "$missing"
          }

          repair_release=false
          if [[ -n "$latest_tag" ]] && git rev-parse -q --verify "refs/tags/${latest_tag}" >/dev/null; then
            if [[ "$(git rev-parse HEAD)" == "$(git rev-parse "${latest_tag}")" ]]; then
              if [[ "${FORCE_REBUILD}" != "true" ]] && release_has_expected_assets "$latest_tag"; then
                echo "changed=false" >>"$GITHUB_OUTPUT"
                echo "No changes since ${latest_tag}, and all expected assets exist; skipping release."
                exit 0
              fi

              repair_release=true
              tag="$latest_tag"
              changelog_range="${latest_tag}..HEAD"
            else
              tag="$(scripts/build-number)"
              changelog_range="${latest_tag}..HEAD"
            fi
          else
            tag="$(scripts/build-number)"
            changelog_range="HEAD"
          fi

          short_sha="$(git rev-parse --short=12 HEAD)"
          built_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "changed=true"
            echo "repair_release=${repair_release}"
            echo "tag=${tag}"
          } >>"$GITHUB_OUTPUT"

          {
            echo "## Hushjar ${tag}"
            echo
            echo "Rolling release for Linux (tarball, Ubuntu 24.04 and 26.04 packages, Arch Linux package), Windows and macOS on AMD64 and ARM64, built from ${short_sha} at ${built_at}."
            echo
            echo "### Changelog"
            echo
            if [[ "$repair_release" == "true" ]]; then
              echo "- Rebuilt release assets for ${short_sha}."
            else
              git log --no-merges --format='- %s (%h)' "$changelog_range"
            fi
          } >release-notes.md
      - if: steps.meta.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  tests:
    name: Tests
    needs: meta
    if: needs.meta.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  linux:
    needs: [meta, tests]
    if: needs.meta.outputs.changed == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HUSHJAR_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxi-dev libudev-dev
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-linux-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: [meta, tests]
    if: needs.meta.outputs.changed == 'true'
    strategy:
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HUSHJAR_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup if the runner has none
        shell: pwsh
        run: scripts/ci-install-rustup.ps1
      - name: Install Rust
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-windows-${{ matrix.runner }}
          path: dist/*.zip
          if-no-files-found: error

  macos:
    needs: [meta, tests]
    if: needs.meta.outputs.changed == 'true'
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HUSHJAR_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-macos-${{ matrix.runner }}
          path: dist/*.zip
          if-no-files-found: error

  deb:
    name: Ubuntu ${{ matrix.release }} ${{ matrix.arch }} package
    needs: [meta, tests]
    if: needs.meta.outputs.changed == 'true'
    strategy:
      matrix:
        release: ["24.04", "26.04"]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:${{ matrix.release }}
    env:
      HUSHJAR_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config dpkg-dev \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxi-dev libudev-dev
      - name: Install Rust and cargo-deb
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" install cargo-deb --locked --version "$CARGO_DEB_VERSION"
        env:
          CARGO_DEB_VERSION: "3.8.0"
      - run: scripts/package-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-deb-${{ matrix.release }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: [meta, tests]
    if: needs.meta.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      HUSHJAR_VERSION: ${{ needs.meta.outputs.tag }}
    steps:
      - name: Install git, Rust and the build libraries
        run: |
          pacman -Syu --noconfirm --needed git rust fontconfig systemd-libs \
            wayland libglvnd libxkbcommon libxkbcommon-x11 libx11 libxcb \
            libxcursor libxi libxrender dbus hicolor-icon-theme
      # git must be installed first, so checkout makes a real clone for
      # git archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # su starts a clean environment, so the version is passed on.
      - name: Build as an ordinary user (makepkg refuses root)
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c "git config --global --add safe.directory '$PWD' && HUSHJAR_VERSION='$HUSHJAR_VERSION' scripts/package-arch.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [meta, linux, windows, macos, deb, arch]
    if: needs.meta.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Add checksums and check the file list
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          for f in *; do sha256sum "$f" >"$f.sha256"; done
          ls -l
          diff <(../scripts/release-assets "$TAG" | sort) <(ls | sort)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          REPAIR_RELEASE: ${{ needs.meta.outputs.repair_release }}
        run: |
          set -euo pipefail
          if [[ "$REPAIR_RELEASE" == "true" ]]; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              dist/*
          fi
